<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BenBot Messenger Bridge — Settings</title>
  <style>
    body { font: 14px system-ui, -apple-system, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    button { padding: 8px 14px; font: inherit; cursor: pointer; }
    .status { margin-top: 12px; padding: 8px 10px; border-radius: 4px; }
    .status.ok { background: #dff5df; }
    .status.err { background: #f7dada; }
    .status.info { background: #eaf1fb; }
    small.hint { display: block; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>BenBot Messenger Bridge</h1>
  <p>The extension only copies conversations into BenBot. It never types or sends replies.</p>

  <label for="apiBase">API base URL</label>
  <input id="apiBase" type="text" placeholder="http://localhost:5000">
  <small class="hint">e.g. <code>http://localhost:5000</code> in dev, or your deployed host in prod.</small>

  <label for="botToken">Bot token (X-Bot-Token)</label>
  <input id="botToken" type="password" placeholder="paste the value from appsettings.json → Messenger:BotToken">

  <div class="row">
    <button id="save">Save</button>
    <button id="test">Test connection</button>
  </div>

  <div id="status" class="status info" style="display:none"></div>

  <script src="options.js"></script>
</body>
</html>
